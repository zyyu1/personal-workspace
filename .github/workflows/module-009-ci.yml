# Module 009 scoped CI — see docs/handoffs/009/MODULE_009_CI_PERMISSION_APPROVAL.md
# Runs only for the Module 009 implementation PR (codex/module-009 -> main).
# Read-only token, no secrets, no deploy, no auto-merge.
name: Module 009 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: module-009-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify node${{ matrix.node }} (typecheck, lint, build, test, diff-check)
    # `branches` above filters the PR base; this guard restricts the PR head.
    if: >-
      github.repository == 'zyyu1/personal-workspace' &&
      github.head_ref == 'codex/module-009' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Record tested SHA
        run: |
          echo "Tested HEAD: $(git rev-parse HEAD)"
          node --version
          npm --version

      - name: Install (npm ci, committed lockfile)
        run: npm ci

      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck

      - name: Lint
        if: success() || failure()
        run: npm run lint

      - name: Build
        if: success() || failure()
        run: npm run build

      - name: Test
        if: success() || failure()
        run: npm test -- --run

      - name: Diff check against PR base
        if: success() || failure()
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Upload build output for browser QA
        if: success() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-009-dist-${{ github.event.pull_request.head.sha }}
          path: dist
          retention-days: 3
          if-no-files-found: error
